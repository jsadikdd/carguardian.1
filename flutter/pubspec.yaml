name: carguardian
description: AI-powered Vehicle Damage Detection & Fleet Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3+1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Notifications
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3

  # Voice
  speech_to_text: 7.3.0

  # Utilities
  intl: 0.20.2
  shared_preferences: ^2.3.1
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
